name: marble-jar

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: marblejar
      POSTGRES_PASSWORD: marblejar
      POSTGRES_DB: marblejar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marblejar -d marblejar"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Ory Hydra — the OBO token broker (RFC 8693 exchange endpoint).
  hydra-migrate:
    image: oryd/hydra:v2.2.0
    command: migrate sql up -e --yes
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://marblejar:marblejar@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:-dev-hydra-system-secret-change-me-32b}

  hydra:
    image: oryd/hydra:v2.2.0
    command: serve all --dev
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://marblejar:marblejar@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:-dev-hydra-system-secret-change-me-32b}
      URLS_SELF_ISSUER: http://localhost:4444
      URLS_SELF_PUBLIC: http://localhost:4444
      URLS_SELF_ADMIN: http://localhost:4445
      SERVE_PUBLIC_PORT: "4444"
      SERVE_ADMIN_PORT: "4445"
      STRATEGIES_ACCESS_TOKEN: jwt
      TTL_ACCESS_TOKEN: 1h
    ports:
      - "4444:4444"
      - "4445:4445"
    healthcheck:
      test: ["CMD", "hydra", "ping", "--endpoint", "http://localhost:4445"]
      interval: 5s
      timeout: 5s
      retries: 30

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenixdata:/mnt/data

  core:
    build:
      context: ./services/core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://marblejar:marblejar@postgres:5432/marblejar?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDPANDA_BROKERS: redpanda:29092
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-signing-key-at-least-32-bytes-long!}
      HMAC_DISPATCH_SECRET: ${HMAC_DISPATCH_SECRET:-dev-dispatch-secret-change-me}
      PHOENIX_BASE_URL: http://phoenix:6006
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      OAUTH_ISSUER_URL: http://hydra:4444
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-marble-jar}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-dev-hydra-client-secret}
      SLACK_OAUTH_CLIENT_ID: ${SLACK_OAUTH_CLIENT_ID:-}
      SLACK_OAUTH_CLIENT_SECRET: ${SLACK_OAUTH_CLIENT_SECRET:-}
      PUBLIC_API_BASE_URL: http://localhost:8080
      WEB_APP_URL: http://localhost:5173
      LOG_LEVEL: info
      PORT: "8080"
    ports:
      - "8080:8080"

  dispatch-worker:
    build:
      context: ./services/core
      dockerfile: Dockerfile.worker
    depends_on:
      - core
      - redpanda
    environment:
      DATABASE_URL: postgres://marblejar:marblejar@postgres:5432/marblejar?sslmode=disable
      REDPANDA_BROKERS: redpanda:29092
      CORE_API_BASE_URL: http://core:8080
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:-set-me-to-an-mj-api-key}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-signing-key-at-least-32-bytes-long!}
      HMAC_DISPATCH_SECRET: ${HMAC_DISPATCH_SECRET:-dev-dispatch-secret-change-me}
      OAUTH_ISSUER_URL: http://hydra:4444
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-marble-jar}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-dev-hydra-client-secret}
      DISPATCH_WORKER_CONCURRENCY: "4"
      WORKER_PORT: "8081"
    ports:
      - "8081:8081"

  mcp-bridge:
    build:
      context: ./services/mcp-bridge
    depends_on:
      - core
    environment:
      CORE_API_BASE_URL: http://core:8080
      PHOENIX_BASE_URL: http://phoenix:6006
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:-set-me-to-an-mj-api-key}
      MCP_SERVER_PORT: "8090"
    ports:
      - "8090:8090"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - core
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"

volumes:
  pgdata:
  phoenixdata:
